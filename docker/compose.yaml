# docker compose -f docker/compose.yaml up --build
# The agent's key or token is pasted on the Agents page, not passed in here.
services:
  tasuki:
    build: ..
    image: tasuki:local
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - ./tasuki.config.jsonc:/instance/tasuki.config.jsonc:ro
      - tasuki-data:/data
volumes:
  tasuki-data:
